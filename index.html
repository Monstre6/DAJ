<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fusion audio rapide</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; color: #1e3a8a; }
  h2, h3 { color: #1e3a8a; }
  #zone { border: 2px dashed #2a7ae2; border-radius: 8px; padding: 30px; text-align: center; background: #f0f7ff; }
  #zone.over { background: #d6eaff; }
  button { padding: 8px 14px; margin: 4px; cursor: pointer; background: #2a7ae2; color: #fff; border: none; border-radius: 4px; }
  button:hover { background: #1e5fc0; }
  button:disabled { background: #9db8dd; cursor: wait; }
  button.petit { background: #e5edf9; color: #1e3a8a; padding: 4px 8px; }
  ul { list-style: none; padding: 0; max-height: 300px; overflow-y: auto; border: 1px solid #dbe7f7; border-radius: 6px; }
  li { padding: 6px 8px; border-bottom: 1px solid #dbe7f7; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #statut { margin: 15px 0; font-weight: bold; }
  #avertissement { color: #b45309; margin: 5px 0; }
  progress { width: 100%; height: 14px; display: none; }
  textarea { width: 100%; height: 220px; margin-top: 10px; font-family: monospace; box-sizing: border-box; }
  input[type=file] { display: none; }
  #actions { display: none; margin-top: 15px; padding: 10px; border: 1px solid #dbe7f7; border-radius: 6px; }
  .carte { border: 1px solid #dbe7f7; border-radius: 6px; padding: 10px; margin: 10px 0; }
  .carte audio { width: 100%; margin: 6px 0; }
</style>
</head>
<body>
<h2>Fusion audio rapide</h2>

<div id="zone">
  Glissez vos fichiers audio ou vos ZIP ici<br><br>
  <button id="btnFichiers">Choisir des fichiers ou un ZIP</button>
  <button id="btnDossier">Choisir un dossier</button>
  <input type="file" id="inputFichiers" multiple accept="audio/*,.zip">
  <input type="file" id="inputDossier" webkitdirectory>
</div>

<p>Morceaux ajoutés : <span id="nombre">0</span> (ordre : haut vers bas)</p>
<ul id="liste"></ul>
<button id="vider" class="petit">Tout effacer</button>
<br>
<button id="fusionner">Créer les parties (10 musiques par partie)</button>

<progress id="barre" max="100" value="0"></progress>
<div id="statut"></div>
<div id="avertissement"></div>

<div id="resultats"></div>

<div id="actions">
  <strong>Que voulez-vous faire ?</strong><br>
  <button id="toutTelecharger">Télécharger toutes les parties</button>
  <button id="assembler">Assembler toutes les parties en un seul fichier</button>
</div>

<div id="chapitresBloc" style="display:none">
  <h3>Timestamps pour YouTube</h3>
  <textarea id="chapitres" readonly></textarea>
  <button id="copier">Copier les timestamps</button>
</div>

<script>
const TAUX = 48000;
const CANAUX = 2;
const TAILLE_LOT = 10;
const TAILLE_BLOC = 4096;
const CONFIG = {
  codec: 'mp4a.40.2',
  sampleRate: TAUX,
  numberOfChannels: CANAUX,
  bitrate: 128000,
  aac: { format: 'adts' }
};
const EXT = /\.(mp3|wav|m4a|ogg|flac|aac|wma|webm)$/i;

let morceaux = [];   // { nom, lire() }
let parties = [];    // { nom, blob, minutes }
let lignes = [];     // timestamps, par index de morceau
let ignores = [];
let urlsActives = [];

const zone = document.getElementById('zone');
const liste = document.getElementById('liste');
const statut = document.getElementById('statut');
const barre = document.getElementById('barre');
const avertissement = document.getElementById('avertissement');
const resultats = document.getElementById('resultats');
const actions = document.getElementById('actions');
const boutonFusion = document.getElementById('fusionner');
const inputFichiers = document.getElementById('inputFichiers');
const inputDossier = document.getElementById('inputDossier');

document.getElementById('btnFichiers').onclick = () => inputFichiers.click();
document.getElementById('btnDossier').onclick = () => inputDossier.click();

const pause = ms => new Promise(r => setTimeout(r, ms));

function nomBase(chemin) { return chemin.split('/').pop(); }

function estValide(nom) {
  const base = nomBase(nom);
  return base.length > 0 && !base.startsWith('.') && !nom.includes('__MACOSX');
}

function trier(tab) {
  tab.sort((a, b) => a.nom.localeCompare(b.nom, 'fr', { numeric: true }));
}

async function lireZip(fichier) {
  statut.textContent = `Lecture du ZIP : ${fichier.name}...`;
  const zip = await JSZip.loadAsync(fichier);
  const sortie = [];
  for (const entree of Object.values(zip.files)) {
    if (entree.dir || !estValide(entree.name) || !EXT.test(entree.name)) continue;
    sortie.push({ nom: nomBase(entree.name), lire: () => entree.async('arraybuffer') });
  }
  return sortie;
}

async function ajouter(liste_fichiers) {
  const sources = [];
  for (const f of Array.from(liste_fichiers)) {
    try {
      if (/\.zip$/i.test(f.name)) {
        sources.push(...await lireZip(f));
      } else if (estValide(f.name)) {
        sources.push({ nom: f.name, lire: () => f.arrayBuffer() });
      }
    } catch (err) {
      statut.textContent = `Impossible de lire ${f.name} : ${err.message}`;
    }
  }
  trier(sources);
  morceaux.push(...sources);
  afficher();
  statut.textContent = `${sources.length} morceau(x) ajouté(s).`;
}

inputFichiers.addEventListener('change', async e => { await ajouter(e.target.files); e.target.value = ''; });
inputDossier.addEventListener('change', async e => { await ajouter(e.target.files); e.target.value = ''; });
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
zone.addEventListener('dragleave', () => zone.classList.remove('over'));
zone.addEventListener('drop', async e => {
  e.preventDefault();
  zone.classList.remove('over');
  await ajouter(e.dataTransfer.files);
});
document.getElementById('vider').onclick = () => { morceaux = []; afficher(); };

function afficher() {
  liste.innerHTML = '';
  morceaux.forEach((m, i) => {
    const li = document.createElement('li');
    const nom = document.createElement('span');
    nom.textContent = (i + 1) + '. ' + m.nom;
    const boutons = document.createElement('span');

    const monter = document.createElement('button');
    monter.className = 'petit'; monter.textContent = '↑';
    monter.onclick = () => { if (i > 0) { [morceaux[i - 1], morceaux[i]] = [morceaux[i], morceaux[i - 1]]; afficher(); } };

    const descendre = document.createElement('button');
    descendre.className = 'petit'; descendre.textContent = '↓';
    descendre.onclick = () => { if (i < morceaux.length - 1) { [morceaux[i + 1], morceaux[i]] = [morceaux[i], morceaux[i + 1]]; afficher(); } };

    const suppr = document.createElement('button');
    suppr.className = 'petit'; suppr.textContent = '✕';
    suppr.onclick = () => { morceaux.splice(i, 1); afficher(); };

    boutons.append(monter, descendre, suppr);
    li.append(nom, boutons);
    liste.append(li);
  });
  document.getElementById('nombre').textContent = morceaux.length;
}

function formaterTemps(secondes) {
  const s = Math.floor(secondes);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = String(s % 60).padStart(2, '0');
  return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
}

async function decoderSur(ctx, source) {
  try {
    return await ctx.decodeAudioData(await source.lire());
  } catch {
    return null;
  }
}

// Encode une liste de morceaux (indices) en une partie AAC, avec son propre encodeur
async function encoderPartie(indices, debutGlobal, ctx) {
  const chunks = [];
  let erreur = null;
  const encoder = new AudioEncoder({
    output: chunk => {
      const b = new Uint8Array(chunk.byteLength);
      chunk.copyTo(b);
      chunks.push(b);
    },
    error: e => { erreur = e; }
  });
  encoder.configure(CONFIG);

  let frames = 0;
  for (const idx of indices) {
    const audio = await decoderSur(ctx, morceaux[idx]);
    if (!audio) { ignores.push(morceaux[idx].nom); continue; }

    lignes[idx] = `${formaterTemps((debutGlobal + frames) / TAUX)} ${morceaux[idx].nom.replace(/\.[^.]+$/, '')}`;

    const L = audio.getChannelData(0);
    const R = audio.numberOfChannels > 1 ? audio.getChannelData(1) : L;
    const n = audio.length;
    for (let s = 0; s < n; s += TAILLE_BLOC) {
      if (erreur) throw erreur;
      const len = Math.min(TAILLE_BLOC, n - s);
      const planar = new Float32Array(len * CANAUX);
      planar.set(L.subarray(s, s + len), 0);
      planar.set(R.subarray(s, s + len), len);
      const data = new AudioData({
        format: 'f32-planar',
        sampleRate: TAUX,
        numberOfFrames: len,
        numberOfChannels: CANAUX,
        timestamp: Math.round((frames + s) * 1e6 / TAUX),
        data: planar
      });
      encoder.encode(data);
      data.close();
      while (encoder.encodeQueueSize > 8) await pause(2);
    }
    frames += n;
    await pause(0);
  }

  await encoder.flush();
  encoder.close();
  if (erreur) throw erreur;
  return { blob: new Blob(chunks, { type: 'audio/aac' }), frames };
}

function ajouterCarte(url, nomFichier, titre) {
  urlsActives.push(url);
  const carte = document.createElement('div');
  carte.className = 'carte';
  const t = document.createElement('strong');
  t.textContent = titre;
  const audio = document.createElement('audio');
  audio.controls = true;
  audio.preload = 'metadata';
  audio.src = url;
  const lien = document.createElement('a');
  lien.href = url;
  lien.download = nomFichier;
  lien.textContent = 'Télécharger ' + nomFichier;
  carte.append(t, audio, document.createElement('br'), lien);
  resultats.appendChild(carte);
}

// Étape 1 : création des parties de 10 musiques
boutonFusion.addEventListener('click', async () => {
  if (morceaux.length === 0) { statut.textContent = 'Ajoutez d\'abord des fichiers ou un ZIP.'; return; }
  if (!window.AudioEncoder) { statut.textContent = 'Utilisez Chrome ou Edge à jour.'; return; }
  const support = await AudioEncoder.isConfigSupported(CONFIG).catch(() => ({ supported: false }));
  if (!support.supported) { statut.textContent = 'L\'encodage AAC n\'est pas disponible sur ce navigateur.'; return; }

  boutonFusion.disabled = true;
  actions.style.display = 'none';
  barre.style.display = 'block';
  barre.value = 0;
  avertissement.textContent = '';
  resultats.innerHTML = '';
  document.getElementById('chapitresBloc').style.display = 'none';
  urlsActives.forEach(u => URL.revokeObjectURL(u));
  urlsActives = [];
  parties = [];
  lignes = [];
  ignores = [];

  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: TAUX });
  const total = morceaux.length;
  const nbLots = Math.ceil(total / TAILLE_LOT);
  let frameGlobal = 0;

  try {
    for (let lot = 0; lot < nbLots; lot++) {
      const indices = [];
      for (let i = lot * TAILLE_LOT; i < Math.min((lot + 1) * TAILLE_LOT, total); i++) indices.push(i);
      statut.textContent = `Partie ${lot + 1} / ${nbLots}...`;
      barre.value = Math.round((lot / nbLots) * 100);

      const { blob, frames } = await encoderPartie(indices, frameGlobal, ctx);
      frameGlobal += frames;

      const nom = `partie-${String(lot + 1).padStart(2, '0')}.aac`;
      const minutes = Math.round(frames / TAUX / 60);
      parties.push({ nom, blob, minutes });
      ajouterCarte(URL.createObjectURL(blob), nom, `Partie ${lot + 1} / ${nbLots} (${minutes} min)`);
    }

    barre.value = 100;
    statut.textContent = `${nbLots} partie(s) prête(s), environ ${Math.round(frameGlobal / TAUX / 60)} minutes au total.`;
    if (ignores.length) avertissement.textContent = `Fichiers ignorés (non lisibles) : ${ignores.join(', ')}`;
    document.getElementById('chapitres').value = lignes.filter(Boolean).join('\n');
    document.getElementById('chapitresBloc').style.display = 'block';
    actions.style.display = 'block';
  } catch (err) {
    statut.textContent = 'Erreur : ' + (err.message || err) + ' (essayez moins de morceaux à la fois)';
  } finally {
    ctx.close();
    boutonFusion.disabled = false;
  }
});

// Étape 2a : télécharger toutes les parties, une après l'autre
document.getElementById('toutTelecharger').addEventListener('click', async () => {
  for (const p of parties) {
    const url = URL.createObjectURL(p.blob);
    const lien = document.createElement('a');
    lien.href = url;
    lien.download = p.nom;
    document.body.appendChild(lien);
    lien.click();
    lien.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    await pause(1500);
  }
  statut.textContent = 'Téléchargements lancés. Acceptez l\'autorisation si le navigateur la demande.';
});

// Étape 2b : assembler toutes les parties en un seul fichier
// Le format ADTS (AAC) se colle bout à bout sans réencodage
document.getElementById('assembler').addEventListener('click', () => {
  if (parties.length === 0) return;
  const minutes = parties.reduce((a, p) => a + p.minutes, 0);
  const complet = new Blob(parties.map(p => p.blob), { type: 'audio/aac' });
  ajouterCarte(URL.createObjectURL(complet), 'musique-complete.aac',
    `Fichier complet assemblé (environ ${minutes} min, ${parties.length} parties)`);
  statut.textContent = 'Fichier complet prêt : écoutez-le ou téléchargez-le.';
  resultats.lastElementChild.scrollIntoView({ behavior: 'smooth' });
});

document.getElementById('copier').onclick = () => {
  const t = document.getElementById('chapitres');
  navigator.clipboard.writeText(t.value).then(
    () => { statut.textContent = 'Timestamps copiés.'; },
    () => { t.select(); document.execCommand('copy'); statut.textContent = 'Timestamps copiés.'; }
  );
};
</script>
</body>
</html>
