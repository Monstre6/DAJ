<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Audio & Vidéo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; color: #1e3a8a; background-color: #f8fafc; }
  
  nav { display: flex; gap: 10px; background: #1e3a8a; padding: 10px 15px; border-radius: 8px; margin-bottom: 25px; }
  nav button { background: transparent; color: #fff; border: none; padding: 10px 16px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; }
  nav button:hover { background: rgba(255, 255, 255, 0.15); }
  nav button.active { background: #2a7ae2; color: #fff; }

  .page { display: none; }
  .page.active { display: block; }

  h2, h3 { color: #1e3a8a; margin-top: 0; }
  .zone-drop { border: 2px dashed #2a7ae2; border-radius: 8px; padding: 25px; text-align: center; background: #f0f7ff; margin-bottom: 15px; }
  
  button { padding: 9px 16px; margin: 4px; cursor: pointer; background: #2a7ae2; color: #fff; border: none; border-radius: 6px; font-weight: 500; }
  button:hover { background: #1e5fc0; }
  button:disabled { background: #9db8dd; cursor: wait; }
  button.petit { background: #e5edf9; color: #1e3a8a; padding: 4px 10px; font-size: 13px; }
  
  ul { list-style: none; padding: 0; max-height: 250px; overflow-y: auto; border: 1px solid #dbe7f7; border-radius: 6px; background: #fff; }
  li { padding: 8px 12px; border-bottom: 1px solid #dbe7f7; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  
  .statut { margin: 15px 0; font-weight: bold; color: #2a7ae2; }
  progress { width: 100%; height: 16px; display: none; margin: 10px 0; }
  textarea { width: 100%; height: 180px; margin-top: 10px; font-family: monospace; box-sizing: border-box; }
  input[type=file] { display: none; }
  
  .resultat-container { margin-top: 20px; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #dbe7f7; }
  audio, video { width: 100%; margin-top: 10px; border-radius: 6px; }
  .preview-img { max-width: 100%; max-height: 200px; border-radius: 6px; margin-top: 10px; display: none; object-fit: contain; }
  .option-group { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #dbe7f7; margin-bottom: 15px; }
</style>
</head>
<body>

<nav>
  <button id="tabAudio" class="active" onclick="changerOnglet('pageAudio', 'tabAudio')">🎵 Fusion Audio</button>
  <button id="tabVideo" onclick="changerOnglet('pageVideo', 'tabVideo')">🎬 Créateur Vidéo</button>
</nav>

<!-- PAGE 1 : FUSION AUDIO -->
<div id="pageAudio" class="page active">
  <h2>Fusion de fichiers audio</h2>
  <div class="zone-drop">
    <button onclick="document.getElementById('inputFichiersAudio').click()">Choisir des musiques MP3</button>
    <input type="file" id="inputFichiersAudio" multiple accept="audio/*">
  </div>
  <p>Morceaux ajoutés : <span id="nombreAudio">0</span></p>
  <ul id="listeAudio"></ul>
  <button id="viderAudio" class="petit">Tout effacer</button>
  <br><br>
  <button id="fusionnerAudio">Créer le fichier audio global</button>
  <progress id="barreAudio" max="100" value="0"></progress>
  <div id="statutAudio" class="statut"></div>
  <div id="resultatAudio" class="resultat-container" style="display:none;"></div>
</div>

<!-- PAGE 2 : CRÉATEUR VIDÉO -->
<div id="pageVideo" class="page">
  <h2>Créer une vidéo (Image de fond + MP3)</h2>

  <div class="option-group">
    <h3>1. Image d'arrière-plan</h3>
    <button onclick="document.getElementById('inputImage').click()">Choisir une photo</button>
    <input type="file" id="inputImage" accept="image/*">
    <br>
    <img id="apercuImage" class="preview-img" alt="Aperçu">
  </div>

  <div class="option-group">
    <h3>2. Pistes audio MP3 (dans l'ordre)</h3>
    <div class="zone-drop">
      <button onclick="document.getElementById('inputFichiersVideo').click()">Ajouter des MP3</button>
      <input type="file" id="inputFichiersVideo" multiple accept="audio/*">
    </div>
    <p>Morceaux ajoutés : <span id="nombreVideo">0</span></p>
    <ul id="listeVideo"></ul>
    <button id="viderVideo" class="petit">Effacer la liste</button>
  </div>

  <button id="genererVideo">🎥 Générer la vidéo</button>
  <progress id="barreVideo" max="100" value="0"></progress>
  <div id="statutVideo" class="statut"></div>

  <div id="resultatVideo" class="resultat-container" style="display:none;">
    <h3>Résultat</h3>
    <video id="lecteurVideo" controls></video>
    <br><br>
    <a id="lienTelechargerVideo"><button>💾 Télécharger la vidéo</button></a>
  </div>
</div>

<script>
let morceauxAudio = [];
let morceauxVideo = [];
let imageFondElement = null;

function changerOnglet(pageId, tabId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  document.getElementById(tabId).classList.add('active');
}

function gererAjoutFichiers(files, tableau, callback) {
  for (let f of files) {
    tableau.push({ nom: f.name, file: f });
  }
  callback();
}

// --- AUDIO ---
const inputAudio = document.getElementById('inputFichiersAudio');
inputAudio.addEventListener('change', e => {
  gererAjoutFichiers(e.target.files, morceauxAudio, afficherAudio);
  e.target.value = '';
});

function afficherAudio() {
  const ul = document.getElementById('listeAudio');
  ul.innerHTML = '';
  morceauxAudio.forEach((m, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span>${i+1}. ${m.nom}</span> <button class="petit" onclick="morceauxAudio.splice(${i},1);afficherAudio()">✕</button>`;
    ul.appendChild(li);
  });
  document.getElementById('nombreAudio').textContent = morceauxAudio.length;
}

document.getElementById('viderAudio').onclick = () => { morceauxAudio = []; afficherAudio(); };

document.getElementById('fusionnerAudio').onclick = async () => {
  if (morceauxAudio.length === 0) { alert("Ajoutez des musiques !"); return; }
  const statut = document.getElementById('statutAudio');
  const barre = document.getElementById('barreAudio');
  barre.style.display = 'block';
  barre.value = 50;
  statut.textContent = "Assemblage basique en cours...";

  // Concaténation directe des blobs pour éviter de saturer la RAM mobile
  const blobs = [];
  for (let m of morceauxAudio) {
    blobs.push(await m.file.arrayBuffer());
  }
  const blobFinal = new Blob(blobs, { type: 'audio/mp3' });
  const url = URL.createObjectURL(blobFinal);

  const res = document.getElementById('resultatAudio');
  res.innerHTML = `<audio controls src="${url}"></audio><br><a download="fusion.mp3" href="${url}"><button>Télécharger l'audio</button></a>`;
  res.style.display = 'block';
  barre.value = 100;
  statut.textContent = "Audio prêt !";
};

// --- VIDEO ---
const inputVideo = document.getElementById('inputFichiersVideo');
inputVideo.addEventListener('change', e => {
  gererAjoutFichiers(e.target.files, morceauxVideo, afficherVideo);
  e.target.value = '';
});

function afficherVideo() {
  const ul = document.getElementById('listeVideo');
  ul.innerHTML = '';
  morceauxVideo.forEach((m, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span>${i+1}. ${m.nom}</span> <button class="petit" onclick="morceauxVideo.splice(${i},1);afficherVideo()">✕</button>`;
    ul.appendChild(li);
  });
  document.getElementById('nombreVideo').textContent = morceauxVideo.length;
}

document.getElementById('viderVideo').onclick = () => { morceauxVideo = []; afficherVideo(); };

document.getElementById('inputImage').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = evt => {
      const img = new Image();
      img.onload = () => {
        imageFondElement = img;
        const apercu = document.getElementById('apercuImage');
        apercu.src = evt.target.result;
        apercu.style.display = 'block';
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  }
});

document.getElementById('genererVideo').onclick = async () => {
  if (morceauxVideo.length === 0) { alert("Ajoutez des musiques !"); return; }
  if (!imageFondElement) { alert("Choisissez une image de fond !"); return; }

  const btn = document.getElementById('genererVideo');
  btn.disabled = true;
  const statut = document.getElementById('statutVideo');
  const barre = document.getElementById('barreVideo');
  barre.style.display = 'block';
  barre.value = 10;
  statut.textContent = "Préparation de la vidéo...";

  try {
    // Utilisation d'un élément Audio HTML classique pour économiser la mémoire mobile
    const audioList = morceauxVideo.map(m => URL.createObjectURL(m.file));
    let currentIndex = 0;
    
    const audioElement = new Audio(audioList[currentIndex]);
    audioElement.crossOrigin = "anonymous";

    const canvas = document.createElement('canvas');
    canvas.width = 640; // Réduit en 640x360 pour éviter les plantages sur téléphone
    canvas.height = 360;
    const ctx = canvas.getContext('2d');

    function dessiner() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (imageFondElement) {
        ctx.drawImage(imageFondElement, 0, 0, canvas.width, canvas.height);
      }
    }
    dessiner();

    const canvasStream = canvas.captureStream(15); // 15 FPS pour alléger au maximum
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sourceNode = audioCtx.createMediaElementSource(audioElement);
    const destinationNode = audioCtx.createMediaStreamDestination();
    sourceNode.connect(destinationNode);
    sourceNode.connect(audioCtx.destination);

    const combinedStream = new MediaStream([
      ...canvasStream.getVideoTracks(),
      ...destinationNode.stream.getAudioTracks()
    ]);

    const recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
    const chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);

    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const lecteur = document.getElementById('lecteurVideo');
      lecteur.src = url;
      const lien = document.getElementById('lienTelechargerVideo');
      lien.href = url;
      lien.download = 'video-finale.webm';

      document.getElementById('resultatVideo').style.display = 'block';
      statut.textContent = "Vidéo générée avec succès !";
      barre.value = 100;
      btn.disabled = false;
    };

    audioElement.onended = () => {
      currentIndex++;
      if (currentIndex < audioList.length) {
        audioElement.src = audioList[currentIndex];
        audioElement.play();
      } else {
        recorder.stop();
        audioCtx.close();
      }
    };

    barre.value = 40;
    statut.textContent = "Enregistrement de la vidéo en cours...";
    
    recorder.start();
    await audioCtx.resume();
    audioElement.play();

    // Boucle d'animation pour rafraîchir le canvas
    function animer() {
      if (!audioElement.ended && !audioElement.paused) {
        dessiner();
        requestAnimationFrame(animer);
      }
    }
    animer();

  } catch (err) {
    alert("Erreur : " + err.message);
    btn.disabled = false;
  }
};
</script>
</body>
</html>
