<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fusion audio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; color: #1e3a8a; }
  h2, h3 { color: #1e3a8a; }
  #zone { border: 2px dashed #2a7ae2; border-radius: 8px; padding: 30px; text-align: center; background: #f0f7ff; }
  #zone.over { background: #d6eaff; }
  button, select { padding: 8px 14px; margin: 4px; border-radius: 4px; }
  button { cursor: pointer; background: #2a7ae2; color: #fff; border: none; }
  button:hover { background: #1e5fc0; }
  button:disabled { background: #9db8dd; cursor: wait; }
  button.petit { background: #e5edf9; color: #1e3a8a; padding: 4px 8px; }
  ul { list-style: none; padding: 0; max-height: 300px; overflow-y: auto; border: 1px solid #dbe7f7; border-radius: 6px; }
  li { padding: 6px 8px; border-bottom: 1px solid #dbe7f7; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #statut { margin: 15px 0; font-weight: bold; }
  #avertissement { color: #b45309; margin: 5px 0; }
  progress { width: 100%; height: 14px; display: none; }
  textarea { width: 100%; height: 220px; margin-top: 10px; font-family: monospace; box-sizing: border-box; }
  input[type=file] { display: none; }
  #resultats { margin-top: 15px; }
  .carte { border: 1px solid #dbe7f7; border-radius: 6px; padding: 10px; margin: 10px 0; }
  .carte audio { width: 100%; margin: 6px 0; }
</style>
</head>
<body>
<h2>Fusion de fichiers audio</h2>

<div id="zone">
  Glissez vos fichiers audio (tous formats) ou vos ZIP ici<br><br>
  <button id="btnFichiers">Choisir des fichiers ou un ZIP</button>
  <button id="btnDossier">Choisir un dossier</button>
  <input type="file" id="inputFichiers" multiple>
  <input type="file" id="inputDossier" webkitdirectory>
</div>

<p>Morceaux ajoutés : <span id="nombre">0</span> (ordre : haut vers bas)</p>
<ul id="liste"></ul>
<button id="vider" class="petit">Tout effacer</button>
<br>
<label>Format de sortie :
  <select id="format">
    <option value="mp3">MP3 (léger, recommandé)</option>
    <option value="wav">WAV (sans compression, très lourd)</option>
  </select>
</label>
<br>
<button id="fusionner">Lancer la fusion par parties de 10</button>
<button id="assembler" style="display:none">Assembler toutes les parties en un fichier</button>

<progress id="barre" max="100" value="0"></progress>
<div id="statut"></div>
<div id="avertissement"></div>

<div id="resultats"></div>

<div id="chapitresBloc" style="display:none">
  <h3>Timestamps pour YouTube</h3>
  <textarea id="chapitres" readonly></textarea>
  <button id="copier">Copier les timestamps</button>
</div>

<script>
const TAUX = 44100;
const CANAUX = 2;
const KBPS = 128;
const TAILLE_LOT = 10;
const TAILLE_ENTETE_WAV = 44;

let morceaux = [];        // { nom, lire() }
let parties = [];         // { nom, blob, frames, format }
let lignesChapitres = [];
let ignores = [];         // fichiers que le navigateur n'a pas su lire
let urlsActives = [];
let ctx = null;

const statut = document.getElementById('statut');
const avertissement = document.getElementById('avertissement');
const barre = document.getElementById('barre');
const liste = document.getElementById('liste');
const resultats = document.getElementById('resultats');
const boutonFusion = document.getElementById('fusionner');
const boutonAssembler = document.getElementById('assembler');
const selectFormat = document.getElementById('format');
const zone = document.getElementById('zone');
const inputFichiers = document.getElementById('inputFichiers');
const inputDossier = document.getElementById('inputDossier');

document.getElementById('btnFichiers').onclick = () => inputFichiers.click();
document.getElementById('btnDossier').onclick = () => inputDossier.click();

const pause = () => new Promise(r => setTimeout(r, 0));

function nomBase(chemin) { return chemin.split('/').pop(); }

// On accepte tout fichier visible ; les formats non lisibles sont signalés à la fusion
function estFichierValide(nom) {
  const base = nomBase(nom);
  return !nom.includes('__MACOSX') && !base.startsWith('.') && base.length > 0;
}

function trier(tab) {
  tab.sort((a, b) => a.nom.localeCompare(b.nom, 'fr', { numeric: true }));
}

async function lireZip(fichier) {
  statut.textContent = `Lecture du ZIP : ${fichier.name}...`;
  const zip = await JSZip.loadAsync(fichier);
  const sortie = [];
  for (const entree of Object.values(zip.files)) {
    if (entree.dir || !estFichierValide(entree.name)) continue;
    sortie.push({ nom: nomBase(entree.name), lire: () => entree.async('arraybuffer') });
  }
  return sortie;
}

async function ajouter(liste_fichiers) {
  const sources = [];
  for (const f of Array.from(liste_fichiers)) {
    try {
      if (/\.zip$/i.test(f.name)) {
        sources.push(...await lireZip(f));
      } else if (estFichierValide(f.name)) {
        sources.push({ nom: f.name, lire: () => f.arrayBuffer() });
      }
    } catch (err) {
      statut.textContent = `Impossible de lire ${f.name} : ${err.message}`;
    }
  }
  trier(sources);
  morceaux.push(...sources);
  afficher();
  statut.textContent = `${sources.length} fichier(s) ajouté(s).`;
}

inputFichiers.addEventListener('change', async e => { await ajouter(e.target.files); e.target.value = ''; });
inputDossier.addEventListener('change', async e => { await ajouter(e.target.files); e.target.value = ''; });
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
zone.addEventListener('dragleave', () => zone.classList.remove('over'));
zone.addEventListener('drop', async e => {
  e.preventDefault();
  zone.classList.remove('over');
  await ajouter(e.dataTransfer.files);
});
document.getElementById('vider').onclick = () => { morceaux = []; afficher(); };

function afficher() {
  liste.innerHTML = '';
  morceaux.forEach((m, i) => {
    const li = document.createElement('li');
    const nom = document.createElement('span');
    nom.textContent = (i + 1) + '. ' + m.nom;
    const boutons = document.createElement('span');

    const monter = document.createElement('button');
    monter.className = 'petit'; monter.textContent = '↑';
    monter.onclick = () => { if (i > 0) { [morceaux[i - 1], morceaux[i]] = [morceaux[i], morceaux[i - 1]]; afficher(); } };

    const descendre = document.createElement('button');
    descendre.className = 'petit'; descendre.textContent = '↓';
    descendre.onclick = () => { if (i < morceaux.length - 1) { [morceaux[i + 1], morceaux[i]] = [morceaux[i], morceaux[i + 1]]; afficher(); } };

    const suppr = document.createElement('button');
    suppr.className = 'petit'; suppr.textContent = '✕';
    suppr.onclick = () => { morceaux.splice(i, 1); afficher(); };

    boutons.append(monter, descendre, suppr);
    li.append(nom, boutons);
    liste.append(li);
  });
  document.getElementById('nombre').textContent = morceaux.length;
}

function formaterTemps(secondes) {
  const s = Math.floor(secondes);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = String(s % 60).padStart(2, '0');
  return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
}

// Décode un fichier ; renvoie null si le navigateur ne sait pas le lire
async function decoderSur(contexte, source) {
  try {
    const buf = await source.lire();
    return await contexte.decodeAudioData(buf);
  } catch {
    return null;
  }
}

function enteteWav(nbFrames) {
  const longueur = nbFrames * CANAUX * 2;
  const v = new DataView(new ArrayBuffer(TAILLE_ENTETE_WAV));
  const ecrire = (p, t) => { for (let i = 0; i < t.length; i++) v.setUint8(p + i, t.charCodeAt(i)); };
  ecrire(0, 'RIFF'); v.setUint32(4, 36 + longueur, true); ecrire(8, 'WAVE');
  ecrire(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, CANAUX, true); v.setUint32(24, TAUX, true);
  v.setUint32(28, TAUX * CANAUX * 2, true); v.setUint16(32, CANAUX * 2, true);
  v.setUint16(34, 16, true); ecrire(36, 'data'); v.setUint32(40, longueur, true);
  return v.buffer;
}

function versPcm(audio) {
  const n = audio.length;
  const g = audio.getChannelData(0);
  const d = audio.numberOfChannels > 1 ? audio.getChannelData(1) : g;
  const out = new Int16Array(n * 2);
  for (let i = 0; i < n; i++) {
    const l = Math.max(-1, Math.min(1, g[i]));
    const r = Math.max(-1, Math.min(1, d[i]));
    out[i * 2] = l < 0 ? l * 0x8000 : l * 0x7FFF;
    out[i * 2 + 1] = r < 0 ? r * 0x8000 : r * 0x7FFF;
  }
  return out;
}

function encoderMp3(enc, audio, sortie) {
  const n = audio.length;
  const g = audio.getChannelData(0);
  const d = audio.numberOfChannels > 1 ? audio.getChannelData(1) : g;
  const L = new Int16Array(n);
  const R = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    L[i] = Math.max(-1, Math.min(1, g[i])) * 32767;
    R[i] = Math.max(-1, Math.min(1, d[i])) * 32767;
  }
  const BLOC = 1152 * 40;
  for (let i = 0; i < n; i += BLOC) {
    const buf = enc.encodeBuffer(L.subarray(i, i + BLOC), R.subarray(i, i + BLOC));
    if (buf.length) sortie(buf);
  }
}

// Encode une liste de morceaux en une partie. Les fichiers illisibles sont ignorés.
async function encoderGroupe(indices, debutGlobal, format, onMorceau) {
  const chunks = [];
  const enc = format === 'mp3' ? new lamejs.Mp3Encoder(CANAUX, TAUX, KBPS) : null;
  const sortie = buf => chunks.push(buf);
  let frames = 0;
  let suivant = decoderSur(ctx, morceaux[indices[0]]);

  for (let k = 0; k < indices.length; k++) {
    const audio = await suivant;
    if (k + 1 < indices.length) suivant = decoderSur(ctx, morceaux[indices[k + 1]]);

    if (!audio) {
      ignores.push(morceaux[indices[k]].nom);
      onMorceau(indices[k], null);
      await pause();
      continue;
    }

    onMorceau(indices[k], debutGlobal + frames);
    if (enc) encoderMp3(enc, audio, sortie);
    else sortie(versPcm(audio).buffer);
    frames += audio.length;
    await pause();
  }

  if (enc) {
    const fin = enc.flush();
    if (fin.length) chunks.push(fin);
    return { blob: new Blob(chunks, { type: 'audio/mpeg' }), frames };
  }
  return { blob: new Blob([enteteWav(frames), ...chunks], { type: 'audio/wav' }), frames };
}

function ajouterCarte(url, nomFichier, titre) {
  urlsActives.push(url);
  const carte = document.createElement('div');
  carte.className = 'carte';
  const t = document.createElement('strong');
  t.textContent = titre;
  const audio = document.createElement('audio');
  audio.controls = true;
  audio.preload = 'metadata';
  audio.src = url;
  const lien = document.createElement('a');
  lien.href = url;
  lien.download = nomFichier;
  lien.textContent = 'Télécharger ' + nomFichier;
  carte.append(t, audio, document.createElement('br'), lien);
  resultats.appendChild(carte);
}

// Étape 1 : fusion par parties de 10
boutonFusion.addEventListener('click', async () => {
  if (morceaux.length === 0) { statut.textContent = 'Ajoutez d\'abord des fichiers ou un ZIP.'; return; }
  const format = selectFormat.value;
  if (format === 'mp3' && typeof lamejs === 'undefined') {
    statut.textContent = 'Encodeur MP3 non chargé. Vérifiez la connexion et rechargez, ou choisissez WAV.';
    return;
  }

  boutonFusion.disabled = true;
  boutonAssembler.style.display = 'none';
  barre.style.display = 'block';
  barre.value = 0;
  avertissement.textContent = '';
  parties = [];
  lignesChapitres = [];
  ignores = [];
  urlsActives.forEach(u => URL.revokeObjectURL(u));
  urlsActives = [];
  resultats.innerHTML = '';
  document.getElementById('chapitresBloc').style.display = 'none';

  ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: TAUX });
  const total = morceaux.length;
  const nbLots = Math.ceil(total / TAILLE_LOT);
  let frameGlobal = 0;
  let traites = 0;

  try {
    for (let lot = 0; lot < nbLots; lot++) {
      const indices = [];
      for (let i = lot * TAILLE_LOT; i < Math.min((lot + 1) * TAILLE_LOT, total); i++) indices.push(i);
      statut.textContent = `Partie ${lot + 1} / ${nbLots}...`;

      const debutLot = frameGlobal;
      const { blob, frames } = await encoderGroupe(indices, debutLot, format, (index, debut) => {
        if (debut !== null) {
          lignesChapitres[index] = `${formaterTemps(debut / TAUX)} ${morceaux[index].nom.replace(/\.[^.]+$/, '')}`;
        }
        traites++;
        barre.value = Math.round((traites / total) * 100);
      });

      frameGlobal += frames;
      const extension = format === 'mp3' ? 'mp3' : 'wav';
      const nom = `partie-${String(lot + 1).padStart(2, '0')}.${extension}`;
      parties.push({ nom, blob, frames, format });
      ajouterCarte(URL.createObjectURL(blob), nom,
        `Partie ${lot + 1} / ${nbLots} (${Math.round(frames / TAUX / 60)} min)`);
    }

    statut.textContent = `${nbLots} partie(s) prête(s), environ ${Math.round(frameGlobal / TAUX / 60)} minutes au total.`;
    barre.value = 100;
    if (ignores.length) {
      avertissement.textContent = `Fichiers ignorés (format non lisible par le navigateur) : ${ignores.join(', ')}. Convertissez-les en MP3 ou WAV pour les inclure.`;
    }
    document.getElementById('chapitres').value = lignesChapitres.filter(Boolean).join('\n');
    document.getElementById('chapitresBloc').style.display = 'block';
    boutonAssembler.style.display = 'inline-block';
  } catch (err) {
    statut.textContent = 'Erreur : ' + err.message + ' (essayez moins de morceaux à la fois)';
  } finally {
    boutonFusion.disabled = false;
    ctx.close();
  }
});

// Étape 2 : assemblage de toutes les parties en un seul fichier
boutonAssembler.addEventListener('click', () => {
  if (parties.length === 0) return;
  const format = parties[0].format;
  const totalFrames = parties.reduce((a, p) => a + p.frames, 0);
  const minutes = Math.round(totalFrames / TAUX / 60);
  let blob;
  let nom;

  if (format === 'mp3') {
    blob = new Blob(parties.map(p => p.blob), { type: 'audio/mpeg' });
    nom = 'musique-complete.mp3';
  } else {
    const donnees = parties.map(p => p.blob.slice(TAILLE_ENTETE_WAV));
    blob = new Blob([enteteWav(totalFrames), ...donnees], { type: 'audio/wav' });
    nom = 'musique-complete.wav';
  }

  const url = URL.createObjectURL(blob);
  urlsActives.push(url);
  ajouterCarte(url, nom, `Fichier complet assemblé (environ ${minutes} min, ${parties.length} parties)`);
  statut.textContent = 'Fichier complet prêt : écoutez-le ou téléchargez-le.';
  resultats.lastElementChild.scrollIntoView({ behavior: 'smooth' });
});

document.getElementById('copier').onclick = () => {
  const t = document.getElementById('chapitres');
  navigator.clipboard.writeText(t.value).then(
    () => { statut.textContent = 'Timestamps copiés.'; },
    () => { t.select(); document.execCommand('copy'); statut.textContent = 'Timestamps copiés.'; }
  );
};
</script>
</body>
</html>
